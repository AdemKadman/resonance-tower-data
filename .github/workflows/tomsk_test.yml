name: tomsk-reachability-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tomsk charts + NOAA Kp
        run: |
          for f in srf sra; do
            code=$(curl -s -o $f.jpg -w '%{http_code}' -A 'Mozilla/5.0 (Macintosh)' -e 'https://sos70.ru/' --max-time 60 "https://sos70.ru/provider.php?file=$f.jpg")
            echo "$f: HTTP $code, $(stat -c %s $f.jpg) bytes, magic $(head -c3 $f.jpg | xxd -p)"
          done
          echo "NOAA: HTTP $(curl -s -o kp.json -w '%{http_code}' --max-time 30 https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json), $(stat -c %s kp.json) bytes"
      - uses: actions/upload-artifact@v4
        with: {name: charts, path: "*.jpg"}
