name: keepalive
# GitHub pauses scheduled workflows after 60 days without repo activity: one tiny commit a month prevents that.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt && git commit -m "keepalive" && git push
